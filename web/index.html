<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GoShort — Сокращатель ссылок</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #2d3436; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #dfe6e9; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #00b894; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #00a884; }
        .result { margin-top: 20px; padding: 10px; background: #e8f8f5; border-radius: 5px; color: #00b894; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GoShort 🚀</h1>
        <form action="/shorten" method="POST">
            <input type="url" name="long_url" placeholder="Вставьте длинную ссылку" required>
            <button type="submit">Сократить</button>
        </form>
        </div>
</body>
</html>
